[project]
name = "ltr"
version = "0.1.0"
description = "GBDT vs neural rankers, and embeddings as tree features"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "torch",
    "matplotlib",
    "tqdm",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltr"]
